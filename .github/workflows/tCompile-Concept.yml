name: TAFJ Routine Compilation

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent overlapping runs against the same TAFJ installation
concurrency:
  group: tafj-r26-compilation
  cancel-in-progress: false

jobs:
  compile:
    name: Compile T24 Routines

    runs-on: [self-hosted, Windows, X64]

    env:
      TAFJ_HOME: C:\R26\TAFJ
      JAVA_HOME: C:\R26\3rdParty\Java\jdk-21

    steps:

      # STEP 1: CHECKOUT SOURCE
      - name: Checkout T24 Source
        uses: actions/checkout@v4

      # STEP 2: CONFIGURE ENVIRONMENT
      - name: Configure TAFJ Environment
        shell: powershell
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:TAFJ_HOME\bin;$env:PATH"

          Write-Host "========================================"
          Write-Host "TAFJ ENVIRONMENT CONFIGURATION"
          Write-Host "========================================"

          Write-Host "TAFJ_HOME : $env:TAFJ_HOME"
          Write-Host "JAVA_HOME : $env:JAVA_HOME"
          Write-Host "WORKSPACE : $env:GITHUB_WORKSPACE"

          $java = Join-Path $env:JAVA_HOME "bin\java.exe"

          if (-not (Test-Path -LiteralPath $java -PathType Leaf)) {
              throw "Java executable not found: $java"
          }

          & $java -version

          if ($LASTEXITCODE -ne 0) {
              throw "Java validation failed."
          }

      # STEP 3: VALIDATE COMPILATION REQUIREMENTS
      - name: Validate Compilation Requirements
        shell: powershell
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE ".github\routines"
          $compiler = Join-Path $env:TAFJ_HOME "bin\tCompile.bat"

          $classesDir = Join-Path $env:TAFJ_HOME "data\tafj\classes\com\temenos\t24"
          $jarsDir = Join-Path $env:TAFJ_HOME "data\tafj\jars"

          if (-not (Test-Path -LiteralPath $sourceDir -PathType Container)) {
              throw "Source directory not found: $sourceDir"
          }

          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
              throw "TAFJ compiler not found: $compiler"
          }

          $components = @(
              Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.component" |
              Sort-Object Name
          )

          $routines = @(
              Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.b" |
              Sort-Object Name
          )

          $totalFiles = $components.Count + $routines.Count

          if ($totalFiles -eq 0) {
              throw "No .component or .b routines found."
          }

          Write-Host "========================================"
          Write-Host "COMPILATION REQUIREMENTS VALIDATED"
          Write-Host "========================================"

          Write-Host "Source Directory : $sourceDir"
          Write-Host "Compiler         : $compiler"
          Write-Host "Classes Output   : $classesDir"
          Write-Host "JAR Output       : $jarsDir"
          Write-Host "Components Found : $($components.Count)"
          Write-Host "Routines Found   : $($routines.Count)"
          Write-Host "Total Files      : $totalFiles"

          Write-Host ""
          Write-Host "COMPILATION ORDER"
          Write-Host "----------------------------------------"

          foreach ($file in $components) {
              Write-Host "COMPONENT: $($file.Name)"
          }

          foreach ($file in $routines) {
              Write-Host "ROUTINE: $($file.Name)"
          }

      # STEP 4: RECORD COMPILATION START TIME
      - name: Record Compilation Start Time
        shell: powershell
        run: |
          $buildStart = (Get-Date).ToUniversalTime().ToString("o")

          "TAFJ_BUILD_START=$buildStart" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "========================================"
          Write-Host "COMPILATION START TIME"
          Write-Host "========================================"
          Write-Host "UTC: $buildStart"

      # STEP 5: COMPILE ROUTINES
      - name: Compile T24 Routines
        shell: powershell
        run: |
          $env:PATH = "$env:JAVA_HOME\bin;$env:TAFJ_HOME\bin;$env:PATH"

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE ".github\routines"
          $compiler = Join-Path $env:TAFJ_HOME "bin\tCompile.bat"

          # Discover components first
          $components = @(
              Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.component" |
              Sort-Object Name
          )

          # Discover remaining routines
          $routines = @(
              Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.b" |
              Sort-Object Name
          )

          # Compilation order
          $allFiles = @($components) + @($routines)

          $totalFiles = $allFiles.Count
          $compiledCount = 0

          Write-Host "========================================"
          Write-Host "TAFJ AUTOMATED COMPILATION"
          Write-Host "========================================"

          Write-Host "Components Found : $($components.Count)"
          Write-Host "Routines Found   : $($routines.Count)"
          Write-Host "Total Files      : $totalFiles"

          if ($totalFiles -eq 0) {
              throw "No source files found."
          }

          foreach ($file in $allFiles) {

              Write-Host ""
              Write-Host "========================================"
              Write-Host "COMPILING: $($file.Name)"
              Write-Host "========================================"

              $output = @(& $compiler $file.FullName 2>&1)
              $exitCode = $LASTEXITCODE

              $output | ForEach-Object {
                  Write-Host "$_"
              }

              $outputText = $output -join "`n"

              # Extract compilation statistics
              $matches = @(
                  [regex]::Matches(
                      $outputText,
                      '(\d+)\s+error(?:s)?\s*\|\s*(\d+)\s+compiled\s*\|\s*(\d+)\s+remaining'
                  )
              )

              if ($matches.Count -eq 0) {
                  throw "FAILED: $($file.Name) - Compilation summary missing."
              }

              $summary = $matches[-1]

              $errors = [int]$summary.Groups[1].Value
              $compiled = [int]$summary.Groups[2].Value
              $remaining = [int]$summary.Groups[3].Value

              Write-Host ""
              Write-Host "----------------------------------------"
              Write-Host "COMPILATION RESULT"
              Write-Host "----------------------------------------"
              Write-Host "File      : $($file.Name)"
              Write-Host "Compiled  : $compiled"
              Write-Host "Errors    : $errors"
              Write-Host "Remaining : $remaining"
              Write-Host "Exit Code : $exitCode"

              if ($exitCode -ne 0) {
                  throw "Compilation failed for $($file.Name). Exit code: $exitCode"
              }

              if ($errors -ne 0) {
                  throw "Compilation failed for $($file.Name). Errors: $errors"
              }

              if ($compiled -ne 1) {
                  throw "Compilation failed for $($file.Name). Expected 1 compiled, got $compiled."
              }

              if ($remaining -ne 0) {
                  throw "Compilation incomplete for $($file.Name). Remaining: $remaining"
              }

              $compiledCount++

              Write-Host "SUCCESS: $($file.Name)"
          }

          # Final compilation verification
          if ($compiledCount -ne $totalFiles) {
              throw "Compilation incomplete. Expected $totalFiles, got $compiledCount."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "TAFJ COMPILATION SUMMARY"
          Write-Host "========================================"

          Write-Host "Total Submitted : $totalFiles"
          Write-Host "Total Compiled  : $compiledCount"
          Write-Host "Total Failed    : 0"
          Write-Host "Pipeline Status : SUCCESS"

      # STEP 6: VERIFY GENERATED ARTIFACTS
      - name: Verify Generated Classes and JARs
        shell: powershell
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE ".github\routines"

          $classesDir = Join-Path $env:TAFJ_HOME "data\tafj\classes\com\temenos\t24"
          $jarsDir = Join-Path $env:TAFJ_HOME "data\tafj\jars"

          Write-Host "========================================"
          Write-Host "TAFJ GENERATED ARTIFACT VALIDATION"
          Write-Host "========================================"

          if (-not (Test-Path -LiteralPath $classesDir -PathType Container)) {
              throw "Classes directory not found: $classesDir"
          }

          if (-not (Test-Path -LiteralPath $jarsDir -PathType Container)) {
              throw "JAR directory not found: $jarsDir"
          }

          # Discover source files
          $components = @(
              Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.component" |
              Sort-Object Name
          )

          $routines = @(
              Get-ChildItem -LiteralPath $sourceDir -File -Filter "*.b" |
              Sort-Object Name
          )

          $validatedClasses = 0
          $validatedJars = 0

          # Read compilation start time
          if (-not $env:TAFJ_BUILD_START) {
              throw "TAFJ_BUILD_START not defined."
          }

          $buildStart = [DateTime]::Parse(
              $env:TAFJ_BUILD_START,
              [System.Globalization.CultureInfo]::InvariantCulture,
              [System.Globalization.DateTimeStyles]::RoundtripKind
          ).ToUniversalTime()

          Write-Host "Build Start (UTC): $buildStart"

          # ========================================
          # VALIDATE COMPONENT JARS
          # ========================================

          Write-Host ""
          Write-Host "VALIDATING COMPONENT JARS"
          Write-Host "----------------------------------------"

          foreach ($component in $components) {

              $jarName = $component.BaseName + ".jar"
              $jarPath = Join-Path $jarsDir $jarName

              Write-Host "Component : $($component.Name)"
              Write-Host "Expected  : $jarName"

              if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) {
                  throw "FAILED: Expected JAR not found: $jarPath"
              }

              $jar = Get-Item -LiteralPath $jarPath

              if ($jar.LastWriteTimeUtc -lt $buildStart) {
                  throw "FAILED: JAR was not updated during this build: $jarName"
              }

              if ($jar.Length -eq 0) {
                  throw "FAILED: Generated JAR is empty: $jarName"
              }

              $validatedJars++

              Write-Host "SUCCESS: $jarName"
              Write-Host "Size: $($jar.Length) bytes"
              Write-Host ""
          }

          # ========================================
          # VALIDATE ROUTINE CLASS FILES
          # ========================================

          Write-Host ""
          Write-Host "VALIDATING ROUTINE CLASSES"
          Write-Host "----------------------------------------"

          foreach ($routine in $routines) {

              $className = $routine.BaseName.Replace(".", "_") + "_cl.class"
              $classPath = Join-Path $classesDir $className

              Write-Host "Routine  : $($routine.Name)"
              Write-Host "Expected : $className"

              if (-not (Test-Path -LiteralPath $classPath -PathType Leaf)) {
                  throw "FAILED: Expected class not found: $classPath"
              }

              $class = Get-Item -LiteralPath $classPath

              if ($class.LastWriteTimeUtc -lt $buildStart) {
                  throw "FAILED: Class was not updated during this build: $className"
              }

              if ($class.Length -eq 0) {
                  throw "FAILED: Generated class is empty: $className"
              }

              $validatedClasses++

              Write-Host "SUCCESS: $className"
              Write-Host "Size: $($class.Length) bytes"
              Write-Host ""
          }

          # ========================================
          # FINAL VALIDATION
          # ========================================

          if ($validatedClasses -ne $routines.Count) {
              throw "Class validation count mismatch."
          }

          if ($validatedJars -ne $components.Count) {
              throw "JAR validation count mismatch."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "TAFJ ARTIFACT VALIDATION SUMMARY"
          Write-Host "========================================"
          Write-Host "Routines Submitted : $($routines.Count)"
          Write-Host "Classes Validated  : $validatedClasses"
          Write-Host "Components         : $($components.Count)"
          Write-Host "JARs Validated     : $validatedJars"
          Write-Host "Pipeline Status    : SUCCESS"
          Write-Host "========================================"
